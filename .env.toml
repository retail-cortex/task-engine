[scheduler]
# Distributed leader election check interval. Production-grade default: "15s" (reduced database contention)
election_interval = "15s"
# Polling frequency for workers to claim pending standard tasks. Default: "5s"
task_claim_interval = "5s"
# Polling frequency for workers to claim pending SOP parsing processes. Default: "5s"
rag_process_claim_interval = "5s"
# Ingestion checks monitoring interval to verify checksum updates at canonical URLs. Default: "60s"
sop_check_interval = "60s"
# Stale logical locks recovery watchdog scan frequency. Default: "30s"
watchdog_interval = "30s"
# Stale execution / process lock expiration threshold. Default: "5m"
lock_timeout = "5m"
# Maximum task rows claimed under a single transaction skip-lock cycle. Default: 5
task_claim_limit = 5
# Maximum SOP process rows claimed under a single transaction skip-lock cycle. Default: 2
rag_process_claim_limit = 2

