name: CI / Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  bazel-test:
    name: Bazel Hermetic Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Bazel
        uses: actions/cache@v4
        with:
          path: ~/.bazel-cache
          key: bazel-cache-${{ runner.os }}-${{ hashFiles('**/BUILD.bazel', '**/MODULE.bazel', '**/MODULE.bazel.lock') }}
          restore-keys: |
            bazel-cache-${{ runner.os }}-

      - name: Build All Targets
        run: bazel build --disk_cache=~/.bazel-cache/disk --repository_cache=~/.bazel-cache/repo //...

      - name: Execute All Tests
        run: bazel test --disk_cache=~/.bazel-cache/disk --repository_cache=~/.bazel-cache/repo //...
