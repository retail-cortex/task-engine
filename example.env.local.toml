# ==============================================================================
# Example Local Configuration Template (example.env.local.toml)
# Copy this file to .env.local.toml in the workspace root and update with your
# local PostgreSQL credentials, GCP Project ID, and OAuth 2.0 client keys.
# ==============================================================================

[gcp_project]
# Replace with your Google Cloud Project ID
id = "your-gcp-project-id"
location = "us-central1"

[persistence]
# Local PostgreSQL / pgvector connection configuration
host = "127.0.0.1"
port = "5432"
user = "gtm_dev"
# XOR-encoded or plaintext password (prefix with 'xor:' if encoded)
password = "your-database-password"
dbname = "gte_dev_db"
sslmode = "disable"

[server]
# Go Gin API Server bind address and port
address = "127.0.0.1"
port = "8080"

[server.oauth]
# Google OAuth 2.0 Client ID for Web / Admin Console authentication
client_id = "your-web-client-id.apps.googleusercontent.com"
# Additional allowed OAuth Client IDs (e.g., Android handset app, A2UI cockpit)
allowed_client_ids = [
    "your-android-client-id.apps.googleusercontent.com",
    "your-cockpit-client-id.apps.googleusercontent.com"
]
# Google OAuth 2.0 Client Secret
secret = "your-oauth-client-secret"

[server.iap]
# Identity-Aware Proxy Audience URL (used in deployed cloud environments)
audience = ""

[scheduler]
# Distributed leader election & background task worker daemon settings
election_interval = "15s"
task_claim_interval = "5s"
rag_process_claim_interval = "5s"
sop_check_interval = "60s"
watchdog_interval = "30s"
lock_timeout = "5m"
task_claim_limit = 5
rag_process_claim_limit = 2
